[project]
name = "hackjunction2026"
version = "0.1.0"
description = "Junction 2026 Intel Physical AI Challenge: SO-101 inspection and sorting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pyserial>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackjunction2026"]

[tool.ruff]
line-length = 110
target-version = "py312"
