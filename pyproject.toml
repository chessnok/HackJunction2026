[project]
name = "hackjunction2026"
version = "0.1.0"
description = "Junction 2026 Intel Physical AI Challenge: SO-101 inspection and sorting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Anomalib dataset capture (hackjunction2026.defect.capture_inspection). Same libraries Studio's
# backend env has; this extra lets the tool run from the repo env too: uv sync --extra capture
capture = [
    "numpy>=2",
    "opencv-python>=4.10",
    "pyyaml>=6",
    "pyrealsense2>=2.56; sys_platform == 'linux'",
]
# Brick detection in the wrist camera, table homography, wrist-camera grab (scripts/pick_above.py):
# uv run --extra table scripts/pick_above.py ...   Headless OpenCV: no GUI needed.
table = [
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackjunction2026"]

[tool.uv]
# opencv-python (capture, needs GUI windows) and opencv-python-headless (table) both install the
# cv2 module and must not share one environment.
conflicts = [[{ extra = "capture" }, { extra = "table" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
