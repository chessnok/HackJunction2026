# Deployed Anomalib brick detector (ADR 0006). Read by hackjunction2026.defect.runtime and
# scripts/brick_anomaly.py. Model files are not in git (exports/ is ignored): rebuild them with
# scripts/brick_retrain.sh or copy exports/anomalib/<run_id>/ from the robot laptop.
run_id: 20261114-081831_patchcore_bricks_z14t
model_xml: exports/anomalib/20261114-081831_patchcore_bricks_z14t/fp16/weights/openvino/model.xml
device: NPU              # GPU is held by the VLM server; latency per crop in ADR 0006
threshold: 0.521         # normalized pred_score; exact 5 %-rule value 0.5205 (0.52 would also flag a good brick at 0.5205)
# Second vote (ADR 0006 follow-up 2; the VLM was dropped): supervised "mark visible" classifier, resnet18
# fine-tuned on a Modal T4 (scripts/mark_classifier_modal.py), OR-ed per crop with PatchCore; 1 ms per crop
# on the NPU. Strict threshold = no false positive on good snapshot crops out of fold. On 50 defective /
# 34 good test bricks: PatchCore OR classifier 92 % recall, 3 % false alarms (classifier alone: crop AUROC
# 0.96). Frozen-feature alternative: outputs/mark_classifier/20261114-085214_resnet18lr_bricks_z14t, 0.9984.
classifier:
  model_xml: outputs/mark_classifier/20261114-093822_finetune_bricks_z14t/model.xml
  threshold: 0.9834
  device: NPU
crop:                    # must match the training dataset (captures/anomalib/dataset/bricks_z14t/dataset.json)
  size: 256
  zoom: 1.4
  whiten: true
  fill: [255, 255, 255]
  hull_grow: 0.04
  feather_px: 2
